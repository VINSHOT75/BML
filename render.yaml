services:
  - type: web
    name: bookmyload-review-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: alembic -c alembic.ini upgrade head && uvicorn server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: DATABASE_URL
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: CORS_ORIGINS
        value: https://bookmyload-review.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: DEFAULT_ORGANIZATION_NAME
        value: BookMyLoad
      - key: EMAIL_WORKER_ENABLED
        value: "false"
      - key: GEOCODING_BASE_URL
        value: https://nominatim.openstreetmap.org
      - key: GEOCODING_USER_AGENT
        value: BookMyLoad/1.0 (client review deployment)

  - type: web
    name: bookmyload-review
    runtime: static
    rootDir: frontend
    buildCommand: npm ci --legacy-peer-deps && npm run build
    staticPublishPath: build
    autoDeployTrigger: commit
    envVars:
      - key: REACT_APP_GOOGLE_CLIENT_ID
        sync: false
      - key: ENABLE_HEALTH_CHECK
        value: "false"
      - key: CI
        value: "false"
    routes:
      - type: rewrite
        source: /api/*
        destination: https://bookmyload-review-api.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
